<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AXIS Puzzle – Merge your way to the target</title>
<meta name="description" content="AXIS Puzzle is a number-merging puzzle game for iPhone. Reach the target before you run out of moves.">
<meta property="og:title" content="AXIS Puzzle">
<meta property="og:description" content="Merge numbers and reach the target before you run out of moves.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fbf3f9;
    --ink: #2b1f2f;
    --muted: #6e5a72;
    --cell: #f1e2ee;
    --tile: #f7d3ee;
    --tile-line: #e3b3d6;
    --hero-tile: #a650cc;
    --ring: #2e7f7a;
    --btn-bg: #111;
    --btn-ink: #fff;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1d1520;
      --ink: #f6eaf4;
      --muted: #bda8c0;
      --cell: #2c2130;
      --tile: #4a2f4a;
      --tile-line: #6b4468;
      --hero-tile: #b866dc;
      --ring: #4fb3ab;
      --btn-bg: #fff;
      --btn-ink: #111;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Fredoka", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: calc(28px + env(safe-area-inset-top, 0px)) 22px calc(24px + env(safe-area-inset-bottom, 0px));
    text-align: center;
  }
  main { width: 100%; max-width: 420px; flex: 1; display: flex; flex-direction: column; align-items: center; }
  .icon { width: 64px; height: 64px; border-radius: 15px; display: grid; place-items: center; background: var(--tile); border: 2px solid var(--tile-line); font-weight: 700; font-size: 22px; color: var(--hero-tile); }
  h1 { font-size: clamp(30px, 8vw, 38px); line-height: 1.1; font-weight: 700; margin: 18px 0 8px; letter-spacing: -0.01em; }
  .lede { color: var(--muted); font-size: 18px; line-height: 1.45; max-width: 32ch; font-weight: 500; }

  .board { position: relative; display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; width: 100%; max-width: 300px; margin: 30px 0 32px; }
  .c { aspect-ratio: 1; border-radius: 10px; background: var(--cell); display: grid; place-items: center; font-weight: 600; font-size: 19px; }
  .t { background: var(--tile); border: 2px solid var(--tile-line); }
  .big { background: var(--hero-tile); border-color: var(--hero-tile); color: #fff; font-size: 22px; animation: pop 0.6s 0.9s ease-out both; }
  .ring { position: absolute; left: -5px; right: calc(40% - 3px); top: calc(16.66% - 1px); height: calc(16.66% - 4px); border: 3px solid var(--ring); border-radius: 999px; pointer-events: none; animation: slide 0.7s 0.2s ease-out both; }
  @keyframes slide { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: none; } }
  @keyframes pop { 0% { transform: scale(0.6); } 70% { transform: scale(1.08); } 100% { transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .ring, .big { animation: none; } }

  .cta { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; min-width: 250px; padding: 14px 28px; border-radius: 16px; background: var(--btn-bg); color: var(--btn-ink); text-decoration: none; line-height: 1.1; }
  .cta small { font-size: 13px; font-weight: 500; opacity: 0.85; }
  .cta span { font-size: 24px; font-weight: 600; }
  .cta:focus-visible { outline: 3px solid var(--ring); outline-offset: 3px; }
  .note { margin-top: 12px; color: var(--muted); font-size: 15px; }
  footer { margin-top: 36px; font-size: 14px; color: var(--muted); }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <div class="icon" aria-hidden="true">32</div>
  <h1>Merge your way to 32</h1>
  <p class="lede">Line up matching numbers, merge them, and reach the target before your moves run out.</p>

  <div class="board" aria-hidden="true">
    <div class="ring"></div>
    <div class="c"></div><div class="c t">4</div><div class="c"></div><div class="c"></div><div class="c"></div>
    <div class="c"></div><div class="c t big">32</div><div class="c t">2</div><div class="c t">2</div><div class="c"></div>
    <div class="c"></div><div class="c t">2</div><div class="c"></div><div class="c"></div><div class="c"></div>
    <div class="c"></div><div class="c"></div><div class="c"></div><div class="c t">8</div><div class="c t">4</div>
    <div class="c"></div><div class="c t">2</div><div class="c"></div><div class="c t">8</div><div class="c t">2</div>
    <div class="c"></div><div class="c"></div><div class="c t">16</div><div class="c"></div><div class="c"></div>
  </div>

  <a class="cta" href="https://apps.apple.com/app/id6825911605">
    <small>Download on the</small>
    <span>App Store</span>
  </a>
  <p class="note">For iPhone and iPad</p>
</main>
<footer>
  © Sonic Trading Teknoloji A.S · <a href="privacy.html">Privacy policy</a>
</footer>
</body>
</html>
